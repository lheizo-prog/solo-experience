spring.application.name=soloforge-api

# Database Configuration (PostgreSQL)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/soloforge}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:soloforge}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:soloforge_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=${GEMINI_MODEL:gemini-1.5-flash}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models

# Server Port
server.port=8080

# Master Access Protection (Login exclusivo do criador)
app.auth.master-user=${APP_MASTER_USER:}
app.auth.master-pass=${APP_MASTER_PASS:}
