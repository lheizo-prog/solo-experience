services:
  postgres:
    image: postgres:16-alpine
    container_name: soloforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: soloforge
      POSTGRES_USER: soloforge
      POSTGRES_PASSWORD: soloforge_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soloforge -d soloforge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
